<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datasets · Indico Crosstab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui/ic.css">
<script src="/static/config.js"></script>
<script src="/static/ui/ic.js"></script>
<script src="/static/ui/datasets.js"></script>
</head>
<body class="ic-body">
<div class="ic-app">
  <ic-sidebar></ic-sidebar>
  <div class="ic-main">
    <ic-topbar></ic-topbar>
    <main class="ic-page">
      <div class="ic-page-header">
        <div>
          <h1 class="ic-title">Datasets</h1>
          <p class="ic-subtitle">Files saved to your library. Open one to see its columns, or analyze it in chat.</p>
        </div>
        <a class="ic-btn ic-btn--primary" href="/datasets/upload"><ic-icon name="plus" size="16"></ic-icon>Upload Dataset</a>
      </div>

      <section class="ic-card">
        <div class="ic-card-header">
          <div class="ic-search" style="max-width:340px">
            <ic-icon name="search" size="16"></ic-icon>
            <input id="filter" type="search" placeholder="Search by name, description or question" aria-label="Search datasets">
          </div>
          <span class="ic-help" id="count"></span>
        </div>
        <div id="list"></div>
      </section>
    </main>
  </div>
</div>
<script>
(function () {
  const box = document.getElementById('list');
  const filter = document.getElementById('filter');
  const count = document.getElementById('count');
  let timer = null;

  async function load() {
    const q = filter.value.trim();
    box.replaceChildren(Datasets.skeleton(5));
    try {
      const files = q ? await Datasets.search(q) : await Datasets.list();
      count.textContent = files.length === 1 ? '1 dataset' : `${IC.number(files.length)} datasets`;
      if (files.length) box.replaceChildren(Datasets.table(files, { onChange: load }));
      else if (q) box.replaceChildren(Datasets.empty(`Nothing matches “${q}”`, 'Try another word, or clear the search.'));
      else box.replaceChildren(Datasets.empty('No datasets yet', 'Upload an SPSS, CSV or Excel file to get started.',
        IC.el('a', { class: 'ic-btn ic-btn--primary ic-btn--sm', href: '/datasets/upload' }, IC.icon('plus', 14), 'Upload Dataset')));
    } catch (err) {
      count.textContent = '';
      box.replaceChildren(Datasets.error(err, load));
    }
  }

  filter.value = new URLSearchParams(location.search).get('q') || '';
  filter.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const url = new URL(location.href);
      if (filter.value.trim()) url.searchParams.set('q', filter.value.trim()); else url.searchParams.delete('q');
      history.replaceState(null, '', url);
      load();
    }, 300);
  });
  load();
})();
</script>
</body>
</html>
