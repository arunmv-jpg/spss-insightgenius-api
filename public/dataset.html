<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataset · Indico Crosstab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui/ic.css">
<script src="/static/config.js"></script>
<script src="/static/ui/ic.js"></script>
<script src="/static/ui/datasets.js"></script>
<style>
  .ds-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 22px; }
  .ds-head-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--ic-success-bg); color: var(--ic-success); display: grid; place-items: center; flex-shrink: 0; }
  .ds-head h1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ds-desc { white-space: pre-line; color: var(--ic-text-muted); }
  .ds-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .ds-col-name { font-weight: 500; }
  .ds-col-label { display: block; color: var(--ic-text-subtle); font-size: 12px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ds-samples { color: var(--ic-text-muted); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body class="ic-body">
<div class="ic-app">
  <ic-sidebar active="datasets"></ic-sidebar>
  <div class="ic-main">
    <ic-topbar></ic-topbar>
    <main class="ic-page">
      <a class="ic-back" href="/datasets"><ic-icon name="arrow-left" size="16"></ic-icon>Back</a>
      <div id="content"></div>
    </main>
  </div>
</div>
<script>
(function () {
  const { el, icon } = IC;
  const PREVIEW_COLUMNS = 8;
  const id = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const content = document.getElementById('content');
  let file = null;
  let variables = null;
  let tab = new URLSearchParams(location.search).get('tab') === 'columns' ? 'columns' : 'overview';

  function typeChip(v) {
    const t = v.detected_type || v.var_type || '—';
    const numeric = /num|scale|float|int/i.test(t);
    return el('span', { class: 'ic-type' + (numeric ? ' ic-type--numeric' : ''), text: t });
  }

  function columnsTable(vars) {
    const tbody = el('tbody');
    for (const v of vars) {
      const labels = Object.values(Datasets.valueLabels(v));
      tbody.append(el('tr', {},
        el('td', {}, el('span', { class: 'ds-col-name', text: v.name }), v.label ? el('span', { class: 'ds-col-label', text: v.label, title: v.label }) : null),
        el('td', {}, typeChip(v)),
        el('td', { class: 'num', text: IC.number(v.n_valid) }),
        el('td', { class: 'num', text: IC.number(v.n_missing) }),
        el('td', { class: 'num', text: v.n_categories ? IC.number(v.n_categories) : '—' }),
        el('td', {}, el('span', { class: 'ds-samples', text: labels.length ? labels.slice(0, 3).join(', ') + (labels.length > 3 ? '…' : '') : '—', title: labels.join(', ') }))));
    }
    return el('div', { class: 'ic-table-wrap' }, el('table', { class: 'ic-table' },
      el('thead', {}, el('tr', {},
        el('th', { text: 'Column name' }), el('th', { text: 'Data type' }), el('th', { class: 'num', text: 'Non-null count' }),
        el('th', { class: 'num', text: 'Missing' }), el('th', { class: 'num', text: 'Answer options' }), el('th', { text: 'Sample values' }))),
      tbody));
  }

  function columnsCard(title, vars, footer) {
    const body = el('div');
    if (vars === null) body.append(Datasets.skeleton(5));
    else if (!vars.length) body.append(el('div', { class: 'ic-empty', text: 'No column details were saved for this dataset.' }));
    else body.append(columnsTable(vars));
    return el('section', { class: 'ic-card' },
      el('div', { class: 'ic-card-header' }, title, footer || null), body);
  }

  function overview() {
    const stats = el('div', { class: 'ic-stat-grid', style: { marginBottom: '24px' } },
      [['Total rows', IC.number(file.n_cases)], ['Total columns', IC.number(file.n_variables)],
       ['File size', IC.bytes(file.size_bytes)], ['File type', (file.file_type || '—').toUpperCase()]]
        .map(([k, v]) => el('div', { class: 'ic-stat' }, el('div', { class: 'ic-stat-label', text: k }), el('div', { class: 'ic-stat-value', text: v }))));
    const parts = [stats];
    const tags = Array.isArray(file.tags) ? file.tags : [];
    if (file.description || tags.length) {
      parts.push(el('section', { class: 'ic-card', style: { marginBottom: '24px' } }, el('div', { class: 'ic-card-body' },
        el('h2', { class: 'ic-section-title', text: 'About this dataset', style: { marginBottom: '8px' } }),
        file.description ? el('p', { class: 'ds-desc', text: file.description }) : null,
        tags.length ? el('div', { class: 'ds-tags' }, tags.map(t => el('span', { class: 'ic-badge', text: t }))) : null)));
    }
    const shown = variables === null ? null : variables.slice(0, PREVIEW_COLUMNS);
    const more = variables && variables.length > PREVIEW_COLUMNS
      ? el('button', { class: 'ic-link', type: 'button', style: { background: 'none', border: 0, cursor: 'pointer', fontSize: '13px' }, onclick: () => setTab('columns') },
          `View all ${IC.number(variables.length)} columns`, icon('arrow-right', 14))
      : null;
    parts.push(columnsCard(el('h2', { class: 'ic-section-title', text: 'Column summary' }), shown, more));
    return parts;
  }

  function columnsTab() {
    const input = el('input', { type: 'search', placeholder: 'Filter columns', 'aria-label': 'Filter columns' });
    const card = el('div');
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      const vars = variables === null ? null : variables.filter(v => !q || v.name.toLowerCase().includes(q) || String(v.label || '').toLowerCase().includes(q));
      card.replaceChildren(columnsCard(el('div', { class: 'ic-search', style: { maxWidth: '320px' } }, icon('search', 16), input),
        vars, vars ? el('span', { class: 'ic-help', text: `${IC.number(vars.length)} of ${IC.number(variables.length)}` }) : null));
      input.focus();
    };
    input.addEventListener('input', draw);
    draw();
    return [card];
  }

  function setTab(next) {
    tab = next;
    const url = new URL(location.href);
    if (tab === 'columns') url.searchParams.set('tab', 'columns'); else url.searchParams.delete('tab');
    history.replaceState(null, '', url);
    render();
  }

  function render() {
    const name = Datasets.name(file);
    document.title = `${name} · Indico Crosstab`;
    const rename = async () => {
      try { const n = await Datasets.promptRename(file); if (n) { file.display_name = n; render(); IC.toast('Dataset renamed'); } }
      catch (err) { IC.toast(err.message, 'danger'); }
    };
    const remove = async () => {
      try { if (await Datasets.confirmRemove(file)) location.href = '/datasets'; }
      catch (err) { IC.toast(err.message, 'danger'); }
    };
    const head = el('div', { class: 'ds-head' },
      el('div', { class: 'ds-head-icon' }, icon(IC.fileIcon(file.filename), 22)),
      el('div', { style: { flex: 1, minWidth: 0 } },
        el('h1', { class: 'ic-title' }, el('span', { text: name }), el('span', { class: 'ic-badge ic-badge--success ic-badge-dot', text: 'In library' })),
        el('p', { class: 'ic-subtitle', text: [file.filename, `${IC.number(file.n_cases)} rows`, `${IC.number(file.n_variables)} columns`, `Uploaded ${IC.timeAgo(file.created_at)}`].filter(Boolean).join(' • ') })),
      el('div', { class: 'ic-row' },
        el('button', { class: 'ic-btn ic-btn--ghost ic-btn--sm', type: 'button', onclick: rename }, icon('pencil', 14), 'Rename'),
        el('button', { class: 'ic-btn ic-btn--danger ic-btn--sm', type: 'button', onclick: remove }, icon('trash', 14), 'Delete'),
        el('a', { class: 'ic-btn ic-btn--primary', href: Datasets.chatHref(file) }, icon('message', 16), 'Analyze in chat')));
    const tabs = el('div', { class: 'ic-tabs', role: 'tablist' },
      [['overview', 'Overview'], ['columns', 'Columns']].map(([k, label]) =>
        el('button', { class: 'ic-tab', type: 'button', role: 'tab', 'aria-selected': String(tab === k), onclick: () => setTab(k) }, label)));
    content.replaceChildren(head, tabs, ...(tab === 'columns' ? columnsTab() : overview()));
  }

  async function load() {
    content.replaceChildren(Datasets.skeleton(3));
    try {
      file = await Datasets.get(id);
      render();
    } catch (err) {
      content.replaceChildren(el('div', { class: 'ic-card' }, err.status === 404
        ? Datasets.empty('Dataset not found', 'It may have been deleted.', el('a', { class: 'ic-btn ic-btn--secondary ic-btn--sm', href: '/datasets' }, 'Back to datasets'))
        : Datasets.error(err, load)));
      return;
    }
    try { variables = await Datasets.variables(id); }
    catch (err) { variables = []; IC.toast('Couldn’t load columns: ' + err.message, 'danger'); }
    render();
  }
  load();
})();
</script>
</body>
</html>
