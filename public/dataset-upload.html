<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Dataset · Indico Crosstab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui/ic.css">
<script src="/static/config.js"></script>
<script src="/static/ui/ic.js"></script>
<script src="/static/ui/datasets.js"></script>
</head>
<body class="ic-body">
<div class="ic-app">
  <ic-sidebar active="datasets"></ic-sidebar>
  <div class="ic-main">
    <ic-topbar></ic-topbar>
    <main class="ic-page" style="max-width:960px">
      <a class="ic-back" href="/datasets"><ic-icon name="arrow-left" size="16"></ic-icon>Back</a>
      <div class="ic-page-header">
        <div>
          <h1 class="ic-title">Upload Dataset</h1>
          <p class="ic-subtitle">Add your market research data to the library. We support SPSS, CSV and Excel files.</p>
        </div>
      </div>

      <section class="ic-card ic-card-body" id="upload-card">
        <label class="ic-dropzone" id="drop" for="file-input" style="padding:56px 24px">
          <span class="ic-dropzone-icon"><ic-icon name="upload-cloud" size="36"></ic-icon></span>
          <span class="ic-dropzone-title" id="drop-title">Drag and drop your file here</span>
          <span class="ic-help">or</span>
          <span class="ic-btn ic-btn--primary" style="margin:6px 0 10px">Browse Files</span>
          <span class="ic-dropzone-hint">Supports SAV, POR, ZSAV, CSV, TSV, XLS and XLSX.</span>
          <input id="file-input" type="file" accept=".sav,.por,.zsav,.csv,.tsv,.xlsx,.xls" hidden>
        </label>
        <div id="status" class="ic-row" style="margin-top:16px" hidden></div>
      </section>

      <section class="ic-card" id="done" hidden>
        <div class="ic-result">
          <span class="ic-result-icon"><ic-icon name="check" size="22"></ic-icon></span>
          <div>
            <div class="ic-result-title">Upload complete</div>
            <div class="ic-result-meta" id="done-meta"></div>
          </div>
        </div>
        <div class="ic-card-footer" style="justify-content:flex-start">
          <a class="ic-btn ic-btn--primary" id="done-open" href="#">View Dataset</a>
          <a class="ic-btn ic-btn--secondary" id="done-chat" href="#"><ic-icon name="message" size="16"></ic-icon>Analyze in chat</a>
          <button class="ic-btn ic-btn--ghost" type="button" id="again">Upload another</button>
        </div>
      </section>

      <section id="recent-wrap" style="margin-top:28px" hidden>
        <h2 class="ic-section-title" style="margin-bottom:12px">Or open a recent dataset</h2>
        <div class="ic-grid-3" id="recent"></div>
      </section>
    </main>
  </div>
</div>
<script>
(function () {
  const { el, icon } = IC;
  const RECENT = 3;
  const drop = document.getElementById('drop');
  const input = document.getElementById('file-input');
  const status = document.getElementById('status');
  const card = document.getElementById('upload-card');
  const done = document.getElementById('done');

  function setStatus(kind, text) {
    status.hidden = !text;
    status.className = kind === 'error' ? 'ic-alert ic-alert--danger' : 'ic-row';
    status.style.marginTop = '16px';
    status.replaceChildren(...(kind === 'busy' ? [el('span', { class: 'ic-spinner' })] : kind === 'error' ? [icon('alert', 16)] : []), el('span', { text }));
  }

  async function upload(file) {
    if (!file) return;
    drop.style.pointerEvents = 'none';
    document.getElementById('drop-title').textContent = file.name;
    setStatus('busy', `Uploading and reading ${file.name}…`);
    try {
      const data = await Datasets.upload(file);
      const f = { id: data.library_id, filename: data.filename || file.name };
      document.getElementById('done-meta').textContent =
        `${data.filename || file.name} • ${IC.number(data.n_cases)} rows • ${IC.number(data.n_variables)} columns`;
      document.getElementById('done-open').href = Datasets.href(f);
      document.getElementById('done-chat').href = Datasets.chatHref(f);
      card.hidden = true;
      done.hidden = false;
    } catch (err) {
      setStatus('error', err.message);
    } finally {
      drop.style.pointerEvents = '';
      input.value = '';
    }
  }

  input.addEventListener('change', () => upload(input.files[0]));
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('is-over'); }));
  drop.addEventListener('drop', e => upload(e.dataTransfer.files[0]));
  document.getElementById('again').addEventListener('click', () => {
    done.hidden = true; card.hidden = false; setStatus('', '');
    document.getElementById('drop-title').textContent = 'Drag and drop your file here';
  });

  Datasets.list().then(files => {
    const recent = files.slice(0, RECENT);
    if (!recent.length) return;
    document.getElementById('recent').replaceChildren(...recent.map(f => el('a', { class: 'ic-tile', href: Datasets.href(f) },
      el('div', { class: 'ic-tile-icon' }, icon(IC.fileIcon(f.filename), 18)),
      el('div', { class: 'ic-tile-title', text: Datasets.name(f) }),
      el('div', { class: 'ic-tile-desc', text: `${IC.number(f.n_cases)} rows • ${IC.number(f.n_variables)} columns` }))));
    document.getElementById('recent-wrap').hidden = false;
  }).catch(() => { /* recent list is optional */ });
})();
</script>
</body>
</html>
