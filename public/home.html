<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · Indico Crosstab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui/ic.css">
<script src="/static/config.js"></script>
<script src="/static/ui/ic.js"></script>
<script src="/static/ui/datasets.js"></script>
</head>
<body class="ic-body">
<div class="ic-app">
  <ic-sidebar></ic-sidebar>
  <div class="ic-main">
    <ic-topbar></ic-topbar>
    <main class="ic-page">
      <section class="ic-hero">
        <h1 id="greeting">Welcome</h1>
        <p>Turn raw market research data into clean, structured and analysis-ready tables.</p>
        <div class="ic-row">
          <a class="ic-btn ic-btn--primary" href="/datasets/upload"><ic-icon name="plus" size="16"></ic-icon>Upload Dataset</a>
          <a class="ic-btn ic-btn--secondary" href="/workflows">Start a Workflow</a>
        </div>
        <ic-illustration class="ic-hero-art"></ic-illustration>
      </section>

      <section class="ic-card" style="margin-top:28px">
        <div class="ic-card-header">
          <h2 class="ic-section-title">Recent Datasets</h2>
          <a class="ic-link" href="/datasets">View all <ic-icon name="arrow-right" size="14"></ic-icon></a>
        </div>
        <div id="recent"></div>
      </section>
    </main>
  </div>
</div>
<script>
(function () {
  const RECENT = 5;
  const greeting = document.getElementById('greeting');
  greeting.textContent = IC.greeting();
  IC.me().then(u => { if (u) greeting.textContent = `${IC.greeting()}, ${IC.firstName(u.name || u.email)}`; });

  const box = document.getElementById('recent');
  async function load() {
    box.replaceChildren(Datasets.skeleton(4));
    try {
      const files = (await Datasets.list()).slice(0, RECENT);
      box.replaceChildren(files.length
        ? Datasets.table(files, { onChange: load })
        : Datasets.empty('No datasets yet', 'Upload an SPSS, CSV or Excel file to get started.',
            IC.el('a', { class: 'ic-btn ic-btn--primary ic-btn--sm', href: '/datasets/upload' }, IC.icon('plus', 14), 'Upload Dataset')));
    } catch (err) {
      box.replaceChildren(Datasets.error(err, load));
    }
  }
  load();
})();
</script>
</body>
</html>
